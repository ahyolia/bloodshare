services:

  backend:
    build:
      context: ./bloodshare-backend
      dockerfile: Dockerfile
    container_name: bloodshare_backend
    ports:
      - "8000:8000"
    env_file:
      - ./bloodshare-backend/.env
    environment:
      # Données de référence + super admin au premier lancement (seeders idempotents)
      RUN_SEEDERS: "true"
    volumes:
      - ./bloodshare-backend:/var/www/html
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

  # 📖 ->withSchedule() ne fait que déclarer le planning : sans un process qui tourne en
  #    continu pour l'exécuter, aucune des tâches planifiées (notifications...) ne se
  #    lance jamais. Même image que "backend" (mêmes migrations/vendor), mais une
  #    commande différente — pas de port exposé, pas de healthcheck HTTP (rien à y servir).
  scheduler:
    build:
      context: ./bloodshare-backend
      dockerfile: Dockerfile
    container_name: bloodshare_scheduler
    env_file:
      - ./bloodshare-backend/.env
    volumes:
      - ./bloodshare-backend:/var/www/html
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      # 📖 backend n'a pas de bloc healthcheck déclaré dans CE fichier compose (seulement
      #    dans son Dockerfile) : condition: service_healthy fait alors échouer le "up"
      #    ("container has no healthcheck configured"). service_started suffit ici.
      backend:
        condition: service_started
    entrypoint: ["php", "artisan", "schedule:work"]
    # 📖 Couvre le premier lancement sur un clone neuf : si vendor/ n'est pas encore
    #    installé (entrypoint.sh de backend pas encore passé), schedule:work plante au
    #    démarrage — il redémarre jusqu'à ce que backend ait fini de s'installer.
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: bloodshare_db
    environment:
      POSTGRES_USER: bloodshare
      POSTGRES_PASSWORD: bloodshare123
      POSTGRES_DB: bloodshare
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 📖 Crée la base bloodshare_testing (voir phpunit.xml) — docker-entrypoint-initdb.d
      # ne s'exécute qu'au tout premier démarrage, sur un volume postgres_data vide.
      # Volume déjà existant : voir DEVOPS.md pour la commande createdb équivalente.
      - ./bloodshare-backend/docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: bloodshare_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: