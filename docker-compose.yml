services:

  backend:
    build:
      context: ./bloodshare-backend
      dockerfile: Dockerfile
    container_name: bloodshare_backend
    ports:
      - "8000:8000"
    env_file:
      - ./bloodshare-backend/.env
    volumes:
      - ./bloodshare-backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: bloodshare_db
    environment:
      POSTGRES_USER: bloodshare
      POSTGRES_PASSWORD: bloodshare123
      POSTGRES_DB: bloodshare
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodshare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: