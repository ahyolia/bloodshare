# 📖 Dependabot (audit cybersécurité, US-29) : ouvre chaque semaine des PR de mise à jour
#    vers dev, à relire comme les autres. Les mises à jour de sécurité sont proposées même
#    hors de ce rythme.
version: 2
updates:
  - package-ecosystem: composer
    directory: /bloodshare-backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Une PR groupée pour les versions mineures et correctives, une par version majeure.
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /bloodshare-mobile
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      mineures:
        update-types: [minor, patch]
    # 📖 Expo fixe lui-même les versions compatibles de ses paquets et de React Native :
    #    une montée de version majeure se fait avec `npx expo install --fix`, pas ici.
    ignore:
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-native*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
